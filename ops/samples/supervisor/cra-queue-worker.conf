; CRA queue worker — Supervisor sample (Could 13)
;
; Install (adapt paths/user):
;   sudo cp ops/samples/supervisor/cra-queue-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start cra-queue-worker:*
;
; Keep cron for the scheduler (or use systemd timer samples):
;   * * * * * cd /var/www/cra.avalonbg.com && php artisan schedule:run >> /dev/null 2>&1
;
; After deploy:
;   php artisan queue:restart

[program:cra-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/cra.avalonbg.com/artisan queue:work --sleep=1 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/cra.avalonbg.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/cra.avalonbg.com/storage/logs/queue-worker.log
stopwaitsecs=95
